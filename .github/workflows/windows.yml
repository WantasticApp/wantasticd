name: Windows

# Everything Windows: native tests, builds, Authenticode signing and a real
# install/upgrade/uninstall of install.ps1 under Windows PowerShell 5.1 and
# PowerShell 7. Release calls it with the tag; pushes and pull requests that
# touch Windows code run it on their own (nothing is published then).

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (empty for a test build)
        type: string
        default: ''
    outputs:
      signed:
        description: '"true" when the executables and install.ps1 were signed'
        value: ${{ jobs.sign.outputs.signed }}
  workflow_dispatch:
  pull_request:
    paths:
      - install.ps1
      - install.ps
      - winres/**
      - cmd/**
      - pkg/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/windows.yml
  push:
    branches: [main]
    paths:
      - install.ps1
      - install.ps
      - winres/**
      - cmd/**
      - pkg/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/windows.yml

permissions:
  contents: read

env:
  GO_VERSION: '1.25.12'
  # Wintun, the tunnel driver wantasticd loads (official prebuilt, signed by
  # WireGuard LLC, shipped unmodified next to wantasticd.exe).
  WINTUN_VERSION: '0.14.1'
  WINTUN_SHA256: '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet and test (tray build)
        env:
          CGO_ENABLED: 0
        # Failures are repeated as annotations so they show on the run page.
        run: |
          # go writes progress to stderr; with 2>&1 that must not be fatal.
          $ErrorActionPreference = "Continue"
          $pkgs = "./cmd/...", "./pkg/...", "./internal/update/...", "./internal/agent/...", "./internal/auth/...", "./internal/platform/firewall/..."
          go vet @pkgs 2>&1 | Tee-Object -FilePath vet.log
          $vet = $LASTEXITCODE
          # TODO: the USP/WUSP runtime tests time out on Windows runners (data
          # model warmup), treat file:// URLs as paths and leave files open in
          # TempDir; skipped until fixed.
          go test -skip '^(TestUSPRuntime|TestIntegration_|TestPersistentDataModelCache)' @pkgs 2>&1 | Tee-Object -FilePath test.log
          $test = $LASTEXITCODE
          if ($vet -or $test) {
            # One annotation (they are capped per step) holding the log tail.
            $tail = Get-Content vet.log, test.log | Where-Object { $_ -notmatch '^(ok|\?)\s' } | Select-Object -Last 80
            Write-Host "::error title=go vet/test failed (vet $vet, test $test)::$(($tail -join '%0A') -replace '\r', '')"
            exit 1
          }
      - name: Desktop collector on real Windows
        env:
          CGO_ENABLED: 0
        # Reads this machine through the native APIs and validates every field.
        run: go test -count=1 -v -run 'Desktop|SMBIOS|TR181' ./internal/wusp/platforms/
      - name: Parse install.ps1 (PowerShell 5.1 and 7)
        run: |
          if ((Get-FileHash install.ps1).Hash -ne (Get-FileHash install.ps).Hash) { throw "install.ps must be a copy of install.ps1" }
          if ([IO.File]::ReadAllBytes("install.ps1") | Where-Object { $_ -gt 127 }) { throw "install.ps1 must be ASCII-only" }
          $check = '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$e) | Out-Null; if ($e) { $e | ForEach-Object { Write-Error $_.ToString() }; exit 1 }'
          powershell -NoProfile -Command $check; if ($LASTEXITCODE) { exit 1 }
          pwsh -NoProfile -Command $check; if ($LASTEXITCODE) { exit 1 }

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, 386]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Version info (Wantastic LLC) and a manifest: unlabelled executables
      # score worse with antivirus heuristics and SmartScreen.
      - name: Windows resources
        run: |
          FILEVER=$(echo "${{ inputs.tag }}" | sed -E 's/^v//; s/[^0-9.].*$//')
          case "$FILEVER" in *.*.*) ;; *) FILEVER="0.0.0" ;; esac
          FILEVER="${FILEVER}.0"
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json \
            --out cmd/wantasticd/rsrc --arch ${{ matrix.goarch }} \
            --file-version "$FILEVER" --product-version "$FILEVER"
          ls -l cmd/wantasticd/rsrc_windows_${{ matrix.goarch }}.syso

      # Console subsystem: commands must print in PowerShell/cmd and be
      # waited for; the tray hides the console it gets at logon. The Windows
      # tray is pure Go, so no cgo. No UPX: packed executables are a common
      # antivirus false positive.
      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          SHA=$(git rev-parse --short HEAD)
          TAG="${{ inputs.tag }}"
          TAG="${TAG:-v0.0.0-dev}"
          LDFLAGS="-s -w -X wantastic-agent/pkg/version.Version=${TAG}+${SHA} -X wantastic-agent/pkg/version.Commit=${SHA} -X wantastic-agent/pkg/version.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -v -trimpath -ldflags="$LDFLAGS" -o wantasticd.exe ./cmd/wantasticd

      - name: Package (with Wintun)
        run: |
          curl -sSfL -o wintun.zip "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip"
          echo "${WINTUN_SHA256}  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          case "${{ matrix.goarch }}" in 386) WARCH=x86 ;; *) WARCH=${{ matrix.goarch }} ;; esac
          cp "wintun/bin/${WARCH}/wintun.dll" wintun.dll
          cp wintun/LICENSE.txt wintun-LICENSE.txt
          mkdir -p dist
          zip "dist/wantasticd-windows-${{ matrix.goarch }}.zip" wantasticd.exe wintun.dll wintun-LICENSE.txt README.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  # Authenticode-signs the executables and install.ps1 as Wantastic LLC
  # (Azure Artifact Signing), for releases only. Enabled by the repository
  # variable WINDOWS_SIGNING=azure; see README "Windows code signing".
  sign:
    needs: build
    if: inputs.tag != '' && vars.WINDOWS_SIGNING == 'azure'
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.done.outputs.signed }}
    strategy:
      fail-fast: true
      matrix:
        goarch: [amd64, arm64, 386]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-${{ matrix.goarch }}
          path: dist
      - name: Unpack
        shell: pwsh
        run: |
          Expand-Archive -Path "dist/wantasticd-windows-${{ matrix.goarch }}.zip" -DestinationPath sign -Force
          New-Item -ItemType Directory -Force -Path sign-installer | Out-Null
          Copy-Item install.ps1 sign-installer/install.ps1
      - name: Sign
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\sign\wantasticd.exe
            ${{ github.workspace }}\sign-installer\install.ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Wantastic
          description-url: https://wantastic.app
      - name: Verify and repack
        shell: pwsh
        run: |
          foreach ($f in "sign/wantasticd.exe", "sign-installer/install.ps1") {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Wantastic LLC") {
              throw "$f is not validly signed by Wantastic LLC"
            }
          }
          Remove-Item dist/*.zip
          Compress-Archive -Path sign/wantasticd.exe, sign/wintun.dll, sign/wintun-LICENSE.txt, sign/README.md -DestinationPath "dist/wantasticd-windows-${{ matrix.goarch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          overwrite: true
      # Identical across the matrix; one copy is enough.
      - uses: actions/upload-artifact@v4
        if: matrix.goarch == 'amd64'
        with:
          name: signed-installer
          path: sign-installer/install.ps1
          if-no-files-found: error
      - id: done
        shell: bash
        run: echo "signed=true" >> "$GITHUB_OUTPUT"

  # Runs install.ps1 for real against the archive just built (signed when
  # signing is on): fresh install, upgrade in place, uninstall, in both
  # Windows PowerShell 5.1 (what most users have) and PowerShell 7.
  installer:
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    # Every Windows the runners offer: Server 2022, Server 2025 (Windows 11
    # 24H2 core) and Windows 11 on ARM64.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
        arch: [amd64]
        include:
          - os: windows-11-arm
            shell: powershell
            arch: arm64
          - os: windows-11-arm
            shell: pwsh
            arch: arm64
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      WANTASTIC_INSTALL_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist
      - name: Signed installer
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: signed-installer
          path: signed-installer
      - name: Pick installer
        shell: pwsh
        run: |
          $src = if (Test-Path signed-installer/install.ps1) { "signed-installer/install.ps1" } else { "install.ps1" }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\wi" | Out-Null
          Copy-Item $src "$env:RUNNER_TEMP\wi\install.ps1"
          Copy-Item "dist/wantasticd-windows-${{ matrix.arch }}.zip" "$env:RUNNER_TEMP\wi\wantasticd.zip"

      # Default install: claim mode. With no login the service waits for the
      # device's claim, so it must start for real and stay Running.
      - name: Fresh install (claim)
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          & "$env:RUNNER_TEMP\wi\install.ps1" -ZipPath "$env:RUNNER_TEMP\wi\wantasticd.zip" -NoTray
          if ($LASTEXITCODE) { exit 1 }

      - name: Check install
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          $ErrorActionPreference = "Stop"
          $exe = "$env:ProgramFiles\Wantastic\wantasticd.exe"
          $svc = Get-CimInstance Win32_Service -Filter "Name='wantasticd'"
          if (-not $svc) { throw "service missing" }
          Write-Host "PathName: $($svc.PathName)  StartMode: $($svc.StartMode)  State: $($svc.State)"
          if (-not $svc.PathName.StartsWith("`"$exe`" connect --config ")) { throw "service path is wrong" }
          if ($svc.PathName -notmatch 'config\.conf"? --tray=false$') { throw "service arguments are wrong" }
          if ($svc.StartMode -ne "Auto") { throw "service is not automatic" }
          if ((& sc.exe qfailure wantasticd | Out-String) -notmatch "RESTART") { throw "no recovery actions" }
          if (-not (Test-Path "$env:ProgramData\Wantastic\device-claim-key.json")) { throw "no claim key" }
          $dll = Get-AuthenticodeSignature "$env:ProgramFiles\Wantastic\wintun.dll"
          Write-Host "wintun.dll: $($dll.Status) $($dll.SignerCertificate.Subject)"
          if ($dll.Status -ne "Valid" -or $dll.SignerCertificate.Subject -notmatch "WireGuard LLC") { throw "wintun.dll missing or not signed by WireGuard LLC" }
          $rule = Get-NetFirewallRule -DisplayName "Wantastic (wantasticd)" -ErrorAction SilentlyContinue
          if (-not $rule) { throw "firewall rule missing" }
          if (($rule | Get-NetFirewallApplicationFilter).Program -ne $exe) { throw "firewall rule has the wrong program" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (($path -split ';') -notcontains "$env:ProgramFiles\Wantastic") { throw "not on PATH" }
          $v = & $exe version | Out-String
          Write-Host $v
          if ($v -notmatch "wantasticd version") { throw "version printed nothing" }

      - name: Service stays up and is controllable
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          $ErrorActionPreference = "Stop"
          $exe = "$env:ProgramFiles\Wantastic\wantasticd.exe"
          Start-Sleep -Seconds 10
          if ((Get-Service wantasticd).Status -ne "Running") { throw "service stopped on its own" }
          $st = & $exe service status | Out-String
          Write-Host $st
          if ($st -notmatch "State:\s+running") { throw "service status wrong" }
          & $exe service stop;    if ($LASTEXITCODE) { throw "service stop failed" }
          if ((Get-Service wantasticd).Status -ne "Stopped") { throw "not stopped" }
          & $exe service start;   if ($LASTEXITCODE) { throw "service start failed" }
          & $exe service restart; if ($LASTEXITCODE) { throw "service restart failed" }
          if ((Get-Service wantasticd).Status -ne "Running") { throw "not running after restart" }

      # A logged-in device: the service creates the Wintun adapter and opens
      # the firewall for its overlay IP. Random keys and an unroutable
      # endpoint (TEST-NET-1), so nothing is contacted.
      - name: Tunnel comes up as a service
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          $ErrorActionPreference = "Stop"
          $exe = "$env:ProgramFiles\Wantastic\wantasticd.exe"
          $key = { [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }) -as [byte[]]) }
          $cfg = @{
            device_id = "ci"; private_key = (& $key); public_key = ""
            server = @{ endpoint = "192.0.2.1"; port = 51820; public_key = (& $key); allowed_ips = @("10.99.0.0/24"); persistent_keepalive = 25 }
            interface = @{ addresses = @("10.99.0.2/32"); listen_port = 0; mtu = 1420; dns = @(); tun_mode = $true; tun_name = "" }
            auth = @{ token = "" }; auto_update = $false
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText("$env:ProgramData\Wantastic\config.conf", $cfg)
          & $exe service restart
          $code = $LASTEXITCODE
          $log = "$env:ProgramData\Wantastic\wantasticd.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 | Out-Host }
          if ($code) { throw "service did not start with a logged-in config" }
          Start-Sleep -Seconds 15
          if ((Get-Service wantasticd).Status -ne "Running") {
            if (Test-Path $log) { Get-Content $log -Tail 40 | Out-Host }
            throw "service stopped with a logged-in config"
          }
          Get-NetAdapter -IncludeHidden | Format-Table Name, InterfaceDescription, Status | Out-Host
          # Wintun names the adapter (Wantastic) and describes it by tunnel type (WireGuard).
          if (-not (Get-NetAdapter -IncludeHidden | Where-Object { $_.Name -eq "Wantastic" -or $_.InterfaceDescription -match "WireGuard|Wintun" })) {
            Get-Content $log -Tail 40 | Out-Host
            throw "no Wantastic tunnel adapter"
          }
          # The agent adds it in the background once the tunnel is up.
          for ($i = 0; -not (Get-NetFirewallRule -Name Wantastic-overlay -ErrorAction SilentlyContinue); $i++) {
            if ($i -ge 60) { Get-Content $log -Tail 40 | Out-Host; throw "overlay firewall rule missing" }
            Start-Sleep -Seconds 1
          }
          & $exe service stop; if ($LASTEXITCODE) { throw "service stop failed" }
          Remove-Item "$env:ProgramData\Wantastic\config.conf"

      - name: Upgrade in place
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          & "$env:RUNNER_TEMP\wi\install.ps1" -ZipPath "$env:RUNNER_TEMP\wi\wantasticd.zip"
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "$env:ProgramFiles\Wantastic\wantasticd.exe.previous")) { throw "no rollback copy" }
          if (-not (Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Run).Wantastic) { throw "tray not registered" }
          $svc = Get-CimInstance Win32_Service -Filter "Name='wantasticd'"
          if ($svc.StartMode -ne "Auto" -or $svc.State -ne "Running") { throw "service not automatic and running after upgrade" }
          if (@(Get-NetFirewallRule -DisplayName "Wantastic (wantasticd)").Count -ne 1) { throw "duplicate firewall rules" }

      - name: Uninstall
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          & "$env:RUNNER_TEMP\wi\install.ps1" -Uninstall -Purge
          if ($LASTEXITCODE) { exit 1 }
          Start-Sleep -Seconds 2
          if (Get-Service wantasticd -ErrorAction SilentlyContinue) { throw "service still there" }
          if (Test-Path "$env:ProgramFiles\Wantastic") { throw "install dir still there" }
          if (Test-Path "$env:ProgramData\Wantastic") { throw "data dir still there after -Purge" }
          if (Get-NetFirewallRule -DisplayName "Wantastic*" -ErrorAction SilentlyContinue) { throw "firewall rule still there" }
          if ((Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Run).Wantastic) { throw "tray still registered" }
          if (Get-Process wantasticd -ErrorAction SilentlyContinue) { throw "wantasticd still running" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (($path -split ';') -contains "$env:ProgramFiles\Wantastic") { throw "still on PATH" }

      - name: Install without sign-in, then uninstall
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          & "$env:RUNNER_TEMP\wi\install.ps1" -ZipPath "$env:RUNNER_TEMP\wi\wantasticd.zip" -NoLogin -NoTray
          if ($LASTEXITCODE) { exit 1 }
          if ((Get-Service wantasticd).Status -ne "Stopped") { throw "service should not start without sign-in" }
          & "$env:RUNNER_TEMP\wi\install.ps1" -Uninstall -Purge
          if ($LASTEXITCODE) { exit 1 }

  # The setup wizard (Inno Setup) per architecture, from the same archive as
  # install.ps1 (signed when signing is on), then a real silent install,
  # upgrade and uninstall on that architecture.
  setup:
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: windows-2025
          - arch: arm64
            os: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist
      - name: Build the setup wizard
        run: |
          Expand-Archive -Path "dist/wantasticd-windows-${{ matrix.arch }}.zip" -DestinationPath payload -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not installed" }
          $version = "${{ inputs.tag }}" -replace '^v', '' -replace '[^0-9.].*$', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.0.0" }
          & $iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DSourceDir=$PWD\payload" installer\windows\wantastic.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path setup-dist | Out-Null
          Copy-Item "installer\windows\output\wantastic-setup-windows-${{ matrix.arch }}.exe" setup-dist\
          Get-ChildItem setup-dist

      - name: Silent install, upgrade, uninstall
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          $setup = (Resolve-Path "setup-dist\wantastic-setup-windows-${{ matrix.arch }}.exe").Path
          $exe = "$env:ProgramFiles\Wantastic\wantasticd.exe"
          foreach ($pass in "install", "upgrade") {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup-$pass.log" -Wait -PassThru
            if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup-$pass.log" -Tail 60; throw "setup $pass exited $($p.ExitCode)" }
            $svc = Get-CimInstance Win32_Service -Filter "Name='wantasticd'"
            if ($svc.StartMode -ne "Auto" -or $svc.State -ne "Running") { throw "service not automatic and running after $pass" }
            $status = & $exe status | Out-String
            Write-Host $status
            # No login on a runner: the service waits for its claim and says so.
            if ($status -notmatch 'Not signed in' -or $status -notmatch 'https://') { throw "status does not show the claim link after $pass" }
            if (-not (Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Run).Wantastic) { throw "tray not registered after $pass" }
            $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
            if (@($path -split ';' | Where-Object { $_.TrimEnd('\') -ieq "$env:ProgramFiles\Wantastic" }).Count -ne 1) { throw "PATH entry missing or duplicated after $pass" }
          }
          $uninstaller = Get-ChildItem "$env:ProgramFiles\Wantastic\unins*.exe" | Select-Object -First 1
          Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands off to a temporary copy of itself.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "program still installed" }
          if (Get-Service wantasticd -ErrorAction SilentlyContinue) { throw "service still there" }
          if ((Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Run).Wantastic) { throw "tray still registered" }
          if (Get-NetFirewallRule -DisplayName "Wantastic*" -ErrorAction SilentlyContinue) { throw "firewall rule still there" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (@($path -split ';' | Where-Object { $_.TrimEnd('\') -ieq "$env:ProgramFiles\Wantastic" }).Count) { throw "still on PATH" }

      - uses: actions/upload-artifact@v4
        if: inputs.tag != ''
        with:
          name: dist-windows-setup-${{ matrix.arch }}
          path: setup-dist/
          if-no-files-found: error
