name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: wantasticd-release
  cancel-in-progress: false

env:
  GO_VERSION: '1.25.12'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        env:
          CGO_ENABLED: 0
        run: go test -tags nosystray ./...
      - name: Vet
        env:
          CGO_ENABLED: 0
        run: go vet -tags nosystray ./...
      - name: Vet Windows (tray build)
        env:
          CGO_ENABLED: 0
          GOOS: windows
        run: go vet ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/...
      - name: Validate installers
        run: |
          sh -n install.sh scripts/install.sh internal/update/self-update.sh
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }'

  create-release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes --verify-tag

  build:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm
          - goos: windows
            goarch: 386
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Version info (Wantastic LLC) and a manifest: unlabelled executables
      # score worse with antivirus heuristics and SmartScreen.
      - name: Windows resources
        if: matrix.goos == 'windows'
        run: |
          FILEVER=$(echo "${{ github.ref_name }}" | sed -E 's/^v//; s/[^0-9.].*$//')
          case "$FILEVER" in *.*.*) ;; *) FILEVER="0.0.0" ;; esac
          FILEVER="${FILEVER}.0"
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json \
            --out cmd/wantasticd/rsrc --arch ${{ matrix.goarch }} \
            --file-version "$FILEVER" --product-version "$FILEVER"
          ls -l cmd/wantasticd/rsrc_windows_${{ matrix.goarch }}.syso

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          SHA=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X wantastic-agent/pkg/version.Version=${{ github.ref_name }}+${SHA} -X wantastic-agent/pkg/version.Commit=${SHA} -X wantastic-agent/pkg/version.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          TAGS=""
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            # The Windows tray is pure Go (no cgo), so Windows keeps it.
            LDFLAGS="$LDFLAGS -H=windowsgui"
            EXT=".exe"
          else
            # Linux targets are headless routers/servers.
            TAGS="nosystray"
          fi
          go build -v -trimpath -tags "$TAGS" -ldflags="$LDFLAGS" -o "wantasticd${EXT}" ./cmd/wantasticd

      # Linux only: UPX-packed Windows executables are a common antivirus
      # false positive.
      - name: Compress binary
        if: matrix.goos != 'windows'
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          BIN=wantasticd
          upx -9 --best "$BIN" || echo "UPX compression failed for ${{ matrix.goos }}/${{ matrix.goarch }}, continuing without compression"

      - name: Package
        run: |
          mkdir -p dist
          NAME="wantasticd-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "dist/${NAME}.zip" wantasticd.exe README.md
          else
            tar -czvf "dist/${NAME}.tar.gz" wantasticd README.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  # macOS needs cgo (Cocoa menu-bar app), so it builds on a macOS runner: one
  # job for both architectures, tested with the tray build. Apple-silicon
  # runners are often short on capacity; if this job cannot run, the Intel
  # fallback below builds the same archives from a separate runner pool.
  build-darwin:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet and test (tray build)
        env:
          CGO_ENABLED: 1
        run: |
          go vet ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/...
          go test ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/...
      - name: Build, sign and verify
        run: sh scripts/build-darwin.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/
          if-no-files-found: error

  build-darwin-intel:
    needs: [create-release, build-darwin]
    if: always() && needs.create-release.result == 'success' && needs.build-darwin.result != 'success'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet and test (tray build)
        env:
          CGO_ENABLED: 1
        run: |
          go vet ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/...
          go test ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/...
      - name: Build, sign and verify
        run: sh scripts/build-darwin.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/
          if-no-files-found: error

  # Authenticode-signs the Windows executables and install.ps1 as Wantastic
  # LLC (Azure Artifact Signing). Enabled by the repository variable
  # WINDOWS_SIGNING=azure; see README "Windows code signing".
  sign-windows:
    needs: build
    if: vars.WINDOWS_SIGNING == 'azure'
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        goarch: [amd64, arm64, 386]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-${{ matrix.goarch }}
          path: dist
      - name: Unpack
        shell: pwsh
        run: |
          Expand-Archive -Path "dist/wantasticd-windows-${{ matrix.goarch }}.zip" -DestinationPath sign -Force
          New-Item -ItemType Directory -Force -Path sign-installer | Out-Null
          Copy-Item install.ps1 sign-installer/install.ps1
      - name: Sign
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\sign\wantasticd.exe
            ${{ github.workspace }}\sign-installer\install.ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Wantastic
          description-url: https://wantastic.app
      - name: Verify and repack
        shell: pwsh
        run: |
          foreach ($f in "sign/wantasticd.exe", "sign-installer/install.ps1") {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Wantastic LLC") {
              throw "$f is not validly signed by Wantastic LLC"
            }
          }
          Remove-Item dist/*.zip
          Compress-Archive -Path sign/wantasticd.exe, sign/README.md -DestinationPath "dist/wantasticd-windows-${{ matrix.goarch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          overwrite: true
      # Identical across the matrix; one copy is enough.
      - uses: actions/upload-artifact@v4
        if: matrix.goarch == 'amd64'
        with:
          name: signed-installer
          path: sign-installer/install.ps1
          if-no-files-found: error

  # Publish only after every platform built, so the "latest" marker never
  # points agents at a release whose archive for their platform is missing.
  publish:
    needs: [build, build-darwin, build-darwin-intel, sign-windows]
    # Signing skipped (not enabled) is fine; signing failed is not: unsigned
    # Windows builds must not ship once signing is on.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') &&
      (needs.build-darwin.result == 'success' || needs.build-darwin-intel.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release upload ${{ github.ref_name }} dist/* --clobber

      - name: Version marker
        run: echo "${{ github.ref_name }}+$(git rev-parse --short HEAD)" > dist/latest

      - name: Check tag is still newest
        id: newest-tag
        run: |
          git fetch --tags --force
          NEWEST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ "$NEWEST_TAG" = "${{ github.ref_name }}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping latest-channel upload because $NEWEST_TAG supersedes ${{ github.ref_name }}"
          fi

      - name: Upload to R2 (versioned)
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: dist
          destination-dir: ${{ github.ref_name }}

      - name: Upload to R2 (latest channel)
        if: steps.newest-tag.outputs.is_newest == 'true'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: dist
          destination-dir: latest

      - name: Signed installer
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: signed-installer
          path: signed-installer

      - name: Prepare root files
        if: steps.newest-tag.outputs.is_newest == 'true'
        run: |
          mkdir -p root_upload
          cp install.sh install.ps1 root_upload/
          if [ -f signed-installer/install.ps1 ]; then
            cp signed-installer/install.ps1 root_upload/install.ps1
          fi
          cp dist/latest root_upload/latest

      # Last: agents poll this marker, and everything it points at is now live.
      - name: Upload root files to R2
        if: steps.newest-tag.outputs.is_newest == 'true'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: root_upload
          destination-dir: ./
