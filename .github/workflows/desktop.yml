name: Desktop

on:
  push:
    branches: [Desktop]
  pull_request:
    branches: [Desktop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Go tests and vet
        run: |
          go test -race -tags nosystray ./internal/config ./internal/device ./internal/agent ./internal/claimkey ./cmd/wantasticd
          go vet -tags "nosystray webkit2_41" ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            artifact: wantastic-desktop-macos-universal
            tags: ''
          - os: windows-2025
            platform: windows/amd64
            artifact: wantastic-desktop-windows-amd64
            tags: ''
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: wantastic-desktop-linux-amd64
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build desktop application
        shell: bash
        run: |
          TAGS="${{ matrix.tags }}"
          LD_FLAGS="-s -w -X wantastic-agent/pkg/version.Version=desktop-${GITHUB_SHA::8} -X wantastic-agent/pkg/version.Commit=${GITHUB_SHA::8}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then LD_FLAGS+=" -extldflags=-mmacosx-version-min=13.0"; fi
          ARGS=(build -clean -platform "${{ matrix.platform }}" -ldflags "$LD_FLAGS")
          if [[ -n "$TAGS" ]]; then ARGS+=(-tags "$TAGS"); fi
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 "${ARGS[@]}"
      - name: Ad-hoc sign and package macOS application
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - --timestamp=none build/bin/Wantastic.app
          codesign --verify --deep --strict --verbose=2 build/bin/Wantastic.app
          ditto -c -k --sequesterRsrc --keepParent build/bin/Wantastic.app build/bin/wantastic-macos-universal.zip
      - name: Self-sign Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=Wantastic Desktop' `
            -FriendlyName 'Wantastic Desktop CI' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(3)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'wantastic-desktop-ci.pfx'
          $pfxPasswordText = [Guid]::NewGuid().ToString('N')
          $pfxPassword = ConvertTo-SecureString $pfxPasswordText -AsPlainText -Force
          try {
            Export-PfxCertificate `
              -Cert $certificate `
              -FilePath $pfxPath `
              -Password $pfxPassword | Out-Null
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName |
              Select-Object -Last 1
            if (-not $signTool) { throw 'signtool.exe was not found' }
            & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $pfxPasswordText build/bin/wantastic.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
            $signature = Get-AuthenticodeSignature -LiteralPath build/bin/wantastic.exe
            $signatureStatus = $signature.Status.ToString()
            $expectedUntrustedRoot = $signatureStatus -eq 'UnknownError' -and
              $signature.StatusMessage -match '(?i)(0x800B0109|root certificate.*not trusted)'
            if ($signatureStatus -notin @('Valid', 'NotTrusted') -and -not $expectedUntrustedRoot) {
              throw "Authenticode signature status is $signatureStatus`: $($signature.StatusMessage)"
            }
            if (-not $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw 'Authenticode signer does not match the generated Wantastic certificate'
            }
            Write-Host "Verified embedded Wantastic signature (status: $signatureStatus; $($signature.StatusMessage))"
          }
          catch {
            Write-Output "::error title=Windows self-signing failed::$($_.Exception.Message)"
            throw
          }
          finally {
            Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.zip
            build/bin/*.exe
            build/bin/wantastic
          if-no-files-found: error
