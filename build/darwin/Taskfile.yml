version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps: [common:build:frontend, common:generate:icons]
    cmds:
      - go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - go build {{if ne .DEV "true"}}-tags production -trimpath{{end}} -buildvcs=false -ldflags="{{if ne .DEV "true"}}-w -s {{end}}{{.WANTASTIC_LDFLAGS}}" -o "{{.OUTPUT}}" .
    vars:
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0

  build:universal:
    cmds:
      - task: build
        vars: { ARCH: amd64, OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-amd64', WANTASTIC_LDFLAGS: '{{.WANTASTIC_LDFLAGS}}' }
      - task: build
        vars: { ARCH: arm64, OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-arm64', WANTASTIC_LDFLAGS: '{{.WANTASTIC_LDFLAGS}}' }
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    deps: [build]
    cmds:
      - task: bundle

  package:universal:
    deps: [build:universal]
    cmds:
      - task: bundle

  bundle:
    cmds:
      - test -n "{{.BIN_DIR}}" && rm -rf -- "{{.BIN_DIR}}/Wantastic.app"
      - mkdir -p "{{.BIN_DIR}}/Wantastic.app/Contents/MacOS" "{{.BIN_DIR}}/Wantastic.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/Wantastic.app/Contents/MacOS/wantastic"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/Wantastic.app/Contents/Info.plist"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/Wantastic.app/Contents/Resources/icons.icns"
      - xattr -cr "{{.BIN_DIR}}/Wantastic.app"
      - codesign --force --deep --sign - --timestamp=none "{{.BIN_DIR}}/Wantastic.app"
      - codesign --verify --deep --strict --verbose=2 "{{.BIN_DIR}}/Wantastic.app"

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
