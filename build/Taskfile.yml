version: '3'

tasks:
  go:mod:tidy:
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:
    internal: true
    run: once
    dir: gui/frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/**/*
    cmds:
      - pnpm install --frozen-lockfile

  generate:bindings:
    run: once
    deps: [go:mod:tidy]
    cmds:
      - go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29 generate bindings -clean=true -ts -d gui/frontend/src/bindings .

  build:frontend:
    run: once
    deps: [install:frontend, generate:bindings]
    dir: gui/frontend
    cmds:
      - pnpm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}

  generate:icons:
    run: once
    cmds:
      - go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29 generate icons -input build/appicon.png -macfilename build/darwin/icons.icns -windowsfilename build/windows/icon.ico

  dev:frontend:
    deps: [install:frontend]
    dir: gui/frontend
    cmds:
      - pnpm dev --port {{.VITE_PORT}} --strictPort
