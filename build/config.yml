version: '3'

info:
  companyName: Wantastic
  productName: Wantastic
  productIdentifier: app.wantastic.desktop
  description: Secure access to your Wantastic tenant network
  copyright: Copyright 2026 Wantastic
  comments: Wantastic VPN desktop client
  version: 1.0.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - bin
      - build/bin
      - gui/frontend/dist
      - gui/frontend/node_modules
    file:
      - .DS_Store
      - '*_test.go'
    watched_extension:
      - '*.go'
      - '*.ts'
      - '*.tsx'
    git_ignore: true
  executes:
    - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29 task build DEV=true
      type: blocking
    - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29 task common:dev:frontend
      type: background
      readiness:
        http: http://127.0.0.1:9245/
        timeout: 60s
        interval: 200ms
    - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29 task run
      type: primary
      exit_policy: shutdown
