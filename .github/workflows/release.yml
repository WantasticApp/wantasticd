name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes --verify-tag

  release:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x 
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.5'

    - name: Build
      run: |
        export GOOS=${{ matrix.goos }}
        export GOARCH=${{ matrix.goarch }}
        export CGO_ENABLED=0
        go build -v -trimpath -ldflags="-s -w -X wantastic-agent/pkg/version.Version=${{ github.ref_name }}+$(git rev-parse --short HEAD) -X wantastic-agent/pkg/version.Commit=$(git rev-parse --short HEAD) -X wantastic-agent/pkg/version.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -o wantasticd-${{ matrix.goarch }} ./cmd/wantasticd

    - name: Compress Binary
      if: matrix.goos != 'darwin'
      run: |
        sudo apt-get update && sudo apt-get install -y upx-ucl
        upx -9 --best wantasticd-${{ matrix.goarch }} || echo "UPX compression failed for ${{ matrix.goarch }}, continuing without compression"

    - name: Package
      run: |
        export GOARCH=${{ matrix.goarch }}
        BINARY_NAME="wantasticd-${GOARCH}"
        # Rename to a generic name for the archive
        mv "${BINARY_NAME}" wantasticd
        tar -czvf "wantasticd-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" wantasticd README.md


    - name: Create Version File
      run: echo "${{ github.ref_name }}+$(git rev-parse --short HEAD)" > latest

    - name: Upload Release Asset
      run: |
        gh release upload ${{ github.ref_name }} wantasticd-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare R2 Upload
      run: |
        mkdir -p r2_upload
        cp wantasticd-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz r2_upload/
        cp latest r2_upload/

    - name: Upload to R2 (Versioned)
      uses: ryand56/r2-upload-action@latest
      with:
        r2-account-id: ${{ secrets.R2_ACCOUNT }}
        r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
        r2-secret-access-key: ${{ secrets.R2_SECRET }}
        r2-bucket: ${{ secrets.R2_BUCKET }}
        source-dir: r2_upload
        destination-dir: ${{ github.ref_name }}

    - name: Upload to R2 (Latest)
      uses: ryand56/r2-upload-action@latest
      with:
        r2-account-id: ${{ secrets.R2_ACCOUNT }}
        r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
        r2-secret-access-key: ${{ secrets.R2_SECRET }}
        r2-bucket: ${{ secrets.R2_BUCKET }}
        source-dir: r2_upload
        destination-dir: latest

  # Build Linux binaries with native libiwinfo support for OpenWrt/QSDK devices
  release-iwinfo:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64, arm, mips, mipsle, mips64, mips64le]
    container:
      image: golang:1.24-bookworm
    steps:
    - uses: actions/checkout@v4

    - name: Install libiwinfo cross-compilation headers
      run: |
        apt-get update && apt-get install -y \
          git gcc libc6-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabihf \
          gcc-mips-linux-gnu \
          gcc-mipsel-linux-gnu \
          gcc-mips64-linux-gnuabi64 \
          gcc-mips64el-linux-gnuabi64
        # Clone libiwinfo headers for CGo compilation
        git clone --depth=1 https://git.openwrt.org/project/iwinfo.git /tmp/iwinfo
        mkdir -p /usr/local/include
        cp /tmp/iwinfo/include/iwinfo.h /usr/local/include/
        # Create a stub libiwinfo.a so the linker is satisfied during cross-compilation.
        # On real devices, the dynamic libiwinfo.so from OpenWrt will be used at runtime.
        echo 'void iwinfo_finish(void){} const void* iwinfo_backend(const char* n){return 0;}' > /tmp/iwinfo_stub.c
        # Build stub for each arch
        for arch_cc in "x86_64-linux-gnu-gcc" "aarch64-linux-gnu-gcc" "arm-linux-gnueabihf-gcc" "mips-linux-gnu-gcc" "mipsel-linux-gnu-gcc" "mips64-linux-gnuabi64-gcc" "mips64el-linux-gnuabi64-gcc"; do
          arch_name=$(echo $arch_cc | cut -d'-' -f1)
          mkdir -p /usr/local/lib/${arch_name}
          ${arch_cc} -c /tmp/iwinfo_stub.c -o /tmp/iwinfo_stub_${arch_name}.o 2>/dev/null || true
          ar rcs /usr/local/lib/${arch_name}/libiwinfo.a /tmp/iwinfo_stub_${arch_name}.o 2>/dev/null || true
        done
        # Also build native stub for amd64
        gcc -c /tmp/iwinfo_stub.c -o /tmp/iwinfo_stub.o
        ar rcs /usr/local/lib/libiwinfo.a /tmp/iwinfo_stub.o

    - name: Set cross-compiler
      id: cc
      run: |
        case "${{ matrix.goarch }}" in
          amd64)    echo "CC=gcc" >> $GITHUB_OUTPUT ;;
          arm64)    echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_OUTPUT ;;
          arm)      echo "CC=arm-linux-gnueabihf-gcc" >> $GITHUB_OUTPUT ;;
          mips)     echo "CC=mips-linux-gnu-gcc" >> $GITHUB_OUTPUT ;;
          mipsle)   echo "CC=mipsel-linux-gnu-gcc" >> $GITHUB_OUTPUT ;;
          mips64)   echo "CC=mips64-linux-gnuabi64-gcc" >> $GITHUB_OUTPUT ;;
          mips64le) echo "CC=mips64el-linux-gnuabi64-gcc" >> $GITHUB_OUTPUT ;;
        esac

    - name: Build with iwinfo
      run: |
        git config --global --add safe.directory '*'
        export GOOS=linux
        export GOARCH=${{ matrix.goarch }}
        export CGO_ENABLED=1
        export CC=${{ steps.cc.outputs.CC }}
        export CGO_CFLAGS="-I/usr/local/include"
        export CGO_LDFLAGS="-L/usr/local/lib"
        go build -v -trimpath -tags iwinfo \
          -ldflags="-s -w -X wantastic-agent/pkg/version.Version=${{ github.ref_name }}+$(git rev-parse --short HEAD) -X wantastic-agent/pkg/version.Commit=$(git rev-parse --short HEAD) -X wantastic-agent/pkg/version.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          -o wantasticd-${{ matrix.goarch }} ./cmd/wantasticd

    - name: Compress Binary
      run: |
        apt-get install -y upx-ucl 2>/dev/null || true
        upx -9 --best wantasticd-${{ matrix.goarch }} || echo "UPX compression failed, continuing"

    - name: Package
      run: |
        mv wantasticd-${{ matrix.goarch }} wantasticd
        tar -czvf "wantasticd-linux-${{ matrix.goarch }}-iwinfo.tar.gz" wantasticd README.md

    - name: Upload Release Asset
      run: |
        gh release upload ${{ github.ref_name }} wantasticd-linux-${{ matrix.goarch }}-iwinfo.tar.gz --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to R2
      run: |
        mkdir -p r2_upload
        cp wantasticd-linux-${{ matrix.goarch }}-iwinfo.tar.gz r2_upload/
      
    - name: Upload to R2 (Versioned)
      uses: ryand56/r2-upload-action@latest
      with:
        r2-account-id: ${{ secrets.R2_ACCOUNT }}
        r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
        r2-secret-access-key: ${{ secrets.R2_SECRET }}
        r2-bucket: ${{ secrets.R2_BUCKET }}
        source-dir: r2_upload
        destination-dir: ${{ github.ref_name }}

    - name: Upload to R2 (Latest)
      uses: ryand56/r2-upload-action@latest
      with:
        r2-account-id: ${{ secrets.R2_ACCOUNT }}
        r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
        r2-secret-access-key: ${{ secrets.R2_SECRET }}
        r2-bucket: ${{ secrets.R2_BUCKET }}
        source-dir: r2_upload
        destination-dir: latest

  upload-utils:
    needs: [release, release-iwinfo]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Prepare Root Upload
      run: |
        mkdir -p root_upload
        cp install.sh root_upload/
        echo "${{ github.ref_name }}+$(git rev-parse --short HEAD)" > root_upload/latest

    - name: Upload Root Artifacts to R2
      uses: ryand56/r2-upload-action@latest
      with:
        r2-account-id: ${{ secrets.R2_ACCOUNT }}
        r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
        r2-secret-access-key: ${{ secrets.R2_SECRET }}
        r2-bucket: ${{ secrets.R2_BUCKET }}
        source-dir: root_upload
        destination-dir: ./
