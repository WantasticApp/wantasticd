name: Android

# The Wantastic Android app (android/). Every push builds and tests it; a tag
# android-vX.Y.Z publishes the signed universal APK to R2 next to the agent
# releases, in its own folder:
#   https://get.wantastic.app/android/latest/wantastic-android.apk
#   https://get.wantastic.app/android/X.Y.Z/wantastic-android-X.Y.Z.apk

on:
  push:
    branches: [android]
    tags: ['android-v*']
    paths:
      - android/**
      - mobile/**
      - internal/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - mobile/**
      - internal/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: mobile/go.sum

      # The Go engine (../mobile, the agent's own code) as an Android library,
      # 16 KB page aligned as Google Play requires for native code.
      - name: Engine (gomobile)
        working-directory: mobile
        run: |
          set -euo pipefail
          MOBILE=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gomobile@$MOBILE" "golang.org/x/mobile/cmd/gobind@$MOBILE"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p ../android/app/libs
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 24 \
            -javapkg app.wantastic -trimpath -ldflags="-s -w -extldflags=-Wl,-z,max-page-size=16384" -o ../android/app/libs/wantastic-engine.aar .
          # Open-source notices for every Go module in the engine.
          go run ./cmd/golicenses -o ../android/app/libs/assets/go-licenses.json

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/android-v}"
            [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be android-vX.Y.Z"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            NAME="0.0.0-dev+$(git rev-parse --short HEAD)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          # Monotonic across builds, as Android requires for upgrades.
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # +200 keeps releases above the local test builds (up to 135) already installed.
          echo "code=$((GITHUB_RUN_NUMBER + 200))" >> "$GITHUB_OUTPUT"

      # The release key never lives in the repository. Tagged releases need
      # it: an APK signed with another key could never be upgraded.
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${{ steps.version.outputs.release }}" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_B64 is not set; refusing to publish a release signed with the debug key"
              exit 1
            fi
            echo "No release key: this build is signed with the debug key (testing only)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Two builds: "direct" (APK from get.wantastic.app, updates itself) and
      # "play" (App Bundle for Google Play, which updates it).
      - name: Test and build
        run: |
          ./gradlew --no-daemon :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest \
            :app:lintDirectRelease :app:lintPlayRelease :app:assembleDirectRelease :app:bundlePlayRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Package
        run: |
          set -eu
          NAME="${{ steps.version.outputs.name }}"
          APK="wantastic-android-${NAME}.apk"
          mkdir -p dist/versioned dist/latest dist/play
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "dist/versioned/$APK"
          cp app/build/outputs/apk/direct/release/app-direct-release.apk dist/latest/wantastic-android.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "dist/play/wantastic-android-${NAME}-play.aab"
          echo "$NAME" > dist/latest/version
          (cd dist/versioned && sha256sum "$APK" > "$APK.sha256")
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs dist/latest/wantastic-android.apk | head -3
          rm -f release.keystore keystore.properties

      # Patches from the last releases to this one, checked with bspatch, and
      # update.json, which the direct build reads to update itself.
      - name: Update feed
        if: steps.version.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq bsdiff >/dev/null
          mkdir -p prev
          gh release list --limit 30 --json tagName -q '.[].tagName' \
            | grep '^android-v' | grep -vx "$GITHUB_REF_NAME" | head -3 \
            | while read -r tag; do
                gh release download "$tag" --pattern 'wantastic-android-*.apk' --dir prev || echo "no APK in $tag"
              done
          python3 tools/release_update.py --version "${{ steps.version.outputs.name }}" --code "${{ steps.version.outputs.code }}" \
            --apk "dist/versioned/wantastic-android-${{ steps.version.outputs.name }}.apk" \
            --previous prev --versioned dist/versioned --latest dist/latest

      - uses: actions/upload-artifact@v4
        with:
          name: wantastic-android-${{ steps.version.outputs.name }}
          path: |
            android/dist/versioned/
            android/dist/play/
          if-no-files-found: error

      - name: GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Wantastic for Android ${{ steps.version.outputs.name }}" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/versioned/*.apk dist/versioned/*.sha256 dist/play/*.aab --clobber

      - name: Upload to R2 (versioned)
        if: steps.version.outputs.release == 'true'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: android/dist/versioned
          destination-dir: android/${{ steps.version.outputs.name }}

      - name: Upload to R2 (latest)
        if: steps.version.outputs.release == 'true'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: android/dist/latest
          destination-dir: android/latest
