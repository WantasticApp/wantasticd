version: '3'

vars:
  APP_NAME: wantastic
  BIN_DIR: build/bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Build the Wails v3 desktop application for the host platform
    cmds:
      - task: '{{.GOOS}}:build'

  package:
    summary: Package the Wails v3 desktop application for the host platform
    cmds:
      - task: '{{.GOOS}}:package'

  run:
    cmds:
      - task: '{{.GOOS}}:run'

  dev:
    summary: Run the native desktop application with frontend hot reload
    cmds:
      - go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29 dev -config ./build/config.yml -port {{.VITE_PORT}}
