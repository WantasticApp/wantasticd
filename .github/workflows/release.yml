name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: wantasticd-release
  cancel-in-progress: false

env:
  GO_VERSION: '1.25.12'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        env:
          CGO_ENABLED: 0
        run: go test -tags nosystray ./...
      - name: Vet
        env:
          CGO_ENABLED: 0
        run: go vet -tags nosystray ./...
      - name: Validate installers
        run: sh -n install.sh scripts/install.sh internal/update/self-update.sh

  create-release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes --verify-tag

  # Linux targets are headless routers/servers.
  build:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
        include:
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          SHA=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X wantastic-agent/pkg/version.Version=${{ github.ref_name }}+${SHA} -X wantastic-agent/pkg/version.Commit=${SHA} -X wantastic-agent/pkg/version.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -v -trimpath -tags nosystray -ldflags="$LDFLAGS" -o wantasticd ./cmd/wantasticd

      - name: Compress binary
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          BIN=wantasticd
          upx -9 --best "$BIN" || echo "UPX compression failed for ${{ matrix.goos }}/${{ matrix.goarch }}, continuing without compression"

      - name: Package
        run: |
          mkdir -p dist
          tar -czvf "dist/wantasticd-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" wantasticd README.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  # macOS needs cgo (Cocoa menu-bar app), so it builds on a macOS runner: one
  # job for both architectures, tested with the tray build. Apple-silicon
  # runners are often short on capacity; if this job cannot run, the Intel
  # fallback below builds the same archives from a separate runner pool.
  build-darwin:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet and test (tray build)
        env:
          CGO_ENABLED: 1
        # Failures are repeated as an annotation so they show on the run page.
        run: |
          set -o pipefail
          status=0
          go vet ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/... 2>&1 | tee vet.log || status=1
          go test ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/... 2>&1 | tee test.log || status=1
          if [ "$status" != 0 ]; then
            # Only the failures (annotations are capped at 4 KiB): vet errors
            # and failing tests with a little context, not the test logs.
            tail=$( { grep -vE '^(ok|#)' vet.log; grep -E -B6 -A2 -- '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' test.log | grep -v '^\[USP\]\|\[USP\]'; } | tail -45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go vet/test failed on macOS::$tail"
            exit 1
          fi
      - name: Build, sign and verify
        run: |
          sh scripts/build-darwin.sh "${{ github.ref_name }}"
          sh scripts/build-darwin-pkg.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/
          if-no-files-found: error

  build-darwin-intel:
    needs: [create-release, build-darwin]
    if: always() && needs.create-release.result == 'success' && needs.build-darwin.result != 'success'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet and test (tray build)
        env:
          CGO_ENABLED: 1
        # Failures are repeated as an annotation so they show on the run page.
        run: |
          set -o pipefail
          status=0
          go vet ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/... 2>&1 | tee vet.log || status=1
          go test ./cmd/... ./pkg/... ./internal/update/... ./internal/agent/... 2>&1 | tee test.log || status=1
          if [ "$status" != 0 ]; then
            # Only the failures (annotations are capped at 4 KiB): vet errors
            # and failing tests with a little context, not the test logs.
            tail=$( { grep -vE '^(ok|#)' vet.log; grep -E -B6 -A2 -- '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' test.log | grep -v '^\[USP\]\|\[USP\]'; } | tail -45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go vet/test failed on macOS::$tail"
            exit 1
          fi
      - name: Build, sign and verify
        run: |
          sh scripts/build-darwin.sh "${{ github.ref_name }}"
          sh scripts/build-darwin-pkg.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/
          if-no-files-found: error

  # Windows lives in its own workflow: native tests, build, signing and a
  # real install/upgrade/uninstall of install.ps1.
  windows:
    needs: create-release
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  # Publish only after every platform built, so the "latest" marker never
  # points agents at a release whose archive for their platform is missing.
  publish:
    needs: [build, build-darwin, build-darwin-intel, windows]
    # The Windows workflow fails when signing is on but did not succeed, so
    # unsigned Windows builds never ship once signing is enabled.
    if: >-
      always() && needs.build.result == 'success' && needs.windows.result == 'success' &&
      (needs.build-darwin.result == 'success' || needs.build-darwin-intel.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release upload ${{ github.ref_name }} dist/* --clobber

      - name: Version marker
        run: echo "${{ github.ref_name }}+$(git rev-parse --short HEAD)" > dist/latest

      - name: Check tag is still newest
        id: newest-tag
        run: |
          git fetch --tags --force
          NEWEST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ "$NEWEST_TAG" = "${{ github.ref_name }}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping latest-channel upload because $NEWEST_TAG supersedes ${{ github.ref_name }}"
          fi

      - name: Upload to R2 (versioned)
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: dist
          destination-dir: ${{ github.ref_name }}

      - name: Upload to R2 (latest channel)
        if: steps.newest-tag.outputs.is_newest == 'true'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: dist
          destination-dir: latest

      # The MikroTik onboarding library, fetched by the console's command as
      # https://get.wantastic.app/init.rsc (bucket root).
      - name: Upload RouterOS library to R2 (root)
        if: steps.newest-tag.outputs.is_newest == 'true'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: routeros
          # Both paths: /routeros/init.rsc (what the console uses) and the
          # bucket root /init.rsc (older copied commands). Without a
          # destination the action keeps the source folder name.
      - name: Upload RouterOS library to R2 (bucket root)
        if: steps.newest-tag.outputs.is_newest == 'true'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: routeros
          destination-dir: .

      - name: Signed installer
        if: needs.windows.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: signed-installer
          path: signed-installer

      - name: Prepare root files
        if: steps.newest-tag.outputs.is_newest == 'true'
        run: |
          mkdir -p root_upload
          cp install.sh install.ps1 root_upload/
          if [ -f signed-installer/install.ps1 ]; then
            cp signed-installer/install.ps1 root_upload/install.ps1
          fi
          cp dist/latest root_upload/latest

      # Last: agents poll this marker, and everything it points at is now live.
      - name: Upload root files to R2
        if: steps.newest-tag.outputs.is_newest == 'true'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: root_upload
          destination-dir: ./
