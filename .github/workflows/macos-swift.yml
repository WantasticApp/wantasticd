name: macOS Swift

on:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Config/**"
      - "Package.swift"
      - "project.yml"
      - "scripts/build-local-app.sh"
      - "docs/**"
      - "Makefile"
      - "internal/wusp/**"
      - "internal/device/**"
      - "testdata/protocol/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-swift.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Config/**"
      - "Package.swift"
      - "project.yml"
      - "scripts/build-local-app.sh"
      - "docs/**"
      - "Makefile"
      - "internal/wusp/**"
      - "internal/device/**"
      - "testdata/protocol/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/macos-swift.yml"

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run Go CLI and protocol compatibility tests
        run: go test ./... -count=1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build Swift package
        run: swift build
      - name: Run Swift tests
        run: make test-swift
      - name: Validate Xcode project specification
        run: brew install xcodegen
      - name: Build and test native Xcode targets
        run: make macos-xcode-test
