version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps: [common:build:frontend]
    cmds:
      - go build -tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s {{.WANTASTIC_LDFLAGS}}" -o "{{.BIN_DIR}}/{{.APP_NAME}}" .
    env:
      GOOS: linux
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1

  package:
    deps: [build]

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
