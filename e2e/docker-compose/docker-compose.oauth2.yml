services:

  # ── Mock Wantastic Portal ─────────────────────────────────────────────────
  mockportal:
    build:
      context: ../../
      dockerfile: e2e/docker-compose/Dockerfile.mockportal
    pull_policy: if_not_present
    container_name: wantasticd-mockportal
    networks:
      wantastic-oauth2:
        ipv4_address: 172.26.0.10
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 15

  # ── Binary builder: compiles wantasticd once into a shared volume ─────────
  builder:
    build:
      context: ../../
      dockerfile: e2e/docker-compose/Dockerfile.oauth2
    pull_policy: if_not_present
    container_name: wantasticd-e2e-builder
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /app && go build -o /out/wantasticd ./cmd/wantasticd && echo "Build OK"
    volumes:
      - ../../:/app
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - binary-out:/out
    restart: "no"

  # ── Auth container: token path ─────────────────────────────────────────────
  # Tests: POST /api/agent/register (HMAC validation + ChaCha20 decryption + config save)
  auth-token:
    build:
      context: ../../
      dockerfile: e2e/docker-compose/Dockerfile.oauth2
    pull_policy: if_not_present
    container_name: wantasticd-auth-token
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /out/wantasticd login --portal-url http://mockportal:8080 --token e2e-test-token
    depends_on:
      mockportal:
        condition: service_healthy
    networks:
      wantastic-oauth2:
        ipv4_address: 172.26.0.11
    extra_hosts:
      - "wg.wantastic.local:host-gateway"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - binary-out:/out
    restart: "no"

  # ── Auth container: device flow path ──────────────────────────────────────
  # Tests: full RFC 8628 device flow (device code → poll → token → register → config)
  auth-device-flow:
    build:
      context: ../../
      dockerfile: e2e/docker-compose/Dockerfile.oauth2
    pull_policy: if_not_present
    container_name: wantasticd-auth-device
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /out/wantasticd login --portal-url http://mockportal:8080
    depends_on:
      mockportal:
        condition: service_healthy
    networks:
      wantastic-oauth2:
        ipv4_address: 172.26.0.12
    extra_hosts:
      - "wg.wantastic.local:host-gateway"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - binary-out:/out
    restart: "no"

  # ── Connect container: verifies agent starts from saved config ────────────
  # Runs after auth-token writes config; starts agent and checks /api/status
  auth-connect:
    build:
      context: ../../
      dockerfile: e2e/docker-compose/Dockerfile.oauth2
    pull_policy: if_not_present
    container_name: wantasticd-auth-connect
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /out/wantasticd connect --config /etc/wantastic/config.conf
    extra_hosts:
      - "wg.wantastic.local:host-gateway"
    networks:
      wantastic-oauth2:
        ipv4_address: 172.26.0.13
    volumes:
      - binary-out:/out
      - ./configs/client1.conf:/etc/wantastic/config.conf:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: "no"

volumes:
  go-mod-cache:
  go-build-cache:
  binary-out:

networks:
  wantastic-oauth2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24
