# .air-openwrt.toml
# Live-reload configuration for the local Docker Compose E2E environment

root = "."
tmp_dir = "tmp"

[build]
# The E2E docker setup uses openwrt/rootfs:x86-64-23.05.0 which is linux/amd64
cmd = "GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ./tmp/wantasticd ./cmd/wantasticd"

# Copy the binary into the running wantasticd-client1 container and restart it
# bin refers to the build output
bin = "./tmp/wantasticd"
args_bin = ["connect", "-v", "-config", "/etc/wantasticd/wg.conf"]

# full_bin is how Air executes the binary. Space separation matters here or it tries to exec the whole string as a filepath.
full_bin = ""
include_ext = ["go", "tpl", "tmpl", "html", "conf"]
exclude_dir = ["assets", "tmp", "vendor", "frontend", "e2e"]
exclude_file = []
delay = 500 # milliseconds to wait before building
stop_on_error = true
kill_delay = "2s"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
